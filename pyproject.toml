[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-coder"
version = "0.1.0"
description = "AI-ассистированный анализ git-проектов через DeepSeek API"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pathspec>=0.12",
    "pydantic>=2.6",
    "openai>=1.30",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ai-coder = "ai_coder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ai_coder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Правила, которые мы хотим видеть
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (реальные проблемы: undefined names, unused imports)
    "I",    # isort (порядок импортов)
    "W",    # pycodestyle warnings
]

# Игнорируем то, что не подходит нашему стилю:
ignore = [
    "E501",    # line too long (проверяется линтером иначе, длинные URL)
    "B008",    # typer.Option в дефолтах — это норма для Typer
    "BLE001",  # except Exception — осознанное решение
    "DTZ005",  # datetime.now() без tz — есть места, где tz не критичен
    "SIM103",  # упрощение if/return — предпочтение стиля
    "SIM102",  # объединение вложенных if
    "C408",    # dict() vs {} — предпочтение
    "TRY004",  # TypeError vs ValueError — предпочтение
    "S110",    # try/except/pass — иногда оправдано
    "RUF059",  # unused unpacked variable — в тестах бывает
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]   # в тестах допускаем неиспользуемые импорты и переменные

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.coverage.run]
source = ["ai_coder"]
omit = ["tests/*", "ai_coder/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
