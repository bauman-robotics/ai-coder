[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-coder"
version = "0.1.0"
description = "AI-ассистированный анализ git-проектов через DeepSeek API"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pathspec>=0.12",
    "pydantic>=2.6",
    "openai>=1.30",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ai-coder = "ai_coder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ai_coder"]

[tool.ruff]
line-length = 100
target-version = "py310"