      "action": "skip" | "modify" | "stop",
      "explanation": "почему",
      "new_subtasks": [
        {"n": 1, "goal": "...", "files": ["..."]}
      ]
    }

    new_subtasks — только для action="modify".
    Для skip/stop — пустой список.
    Никакого текста вне JSON.

