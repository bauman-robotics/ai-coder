<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ journal }} — ai-coder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>{{ project }} / {{ journal }}</h1>
        <nav class="report-nav">
            <a href="/">← к панели</a>
            <a href="{{ raw_url }}" target="_blank">raw .md</a>
            <button type="button" class="copy-path-btn"
                    data-path="{{ report_dir }}"
                    title="Скопировать абсолютный путь к папке задачи">Скопировать путь</button>
        </nav>
    </header>
    <main class="markdown-body">
        {{ content | safe }}
    </main>
    <script>
        (function () {
            function copyText(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                }
                var ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                return Promise.resolve();
            }

            document.querySelectorAll(".copy-path-btn").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var path = btn.getAttribute("data-path") || "";
                    if (!path) { return; }
                    copyText(path);
                    var prev = btn.textContent;
                    btn.textContent = "Скопировано";
                    setTimeout(function () { btn.textContent = prev; }, 1200);
                });
            });
        })();
    </script>
</body>
</html>
