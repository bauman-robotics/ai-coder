<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ai-coder GUI</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <header>
        <h1>ai-coder GUI</h1>
        <nav class="report-nav">
            <a href="/reports" title="Список всех запусков (журналов)">Все отчёты</a>
            <a href="/stats" title="Статистика расходов: графики по дням, моделям, действиям">Статистика</a>
            <a href="/docs/cli" title="Справочник: все команды и флаги">Справочник</a>
        </nav>
    </header>
    <main>
        <p>Веб-панель ai-coder. Соберите команду для запуска агента.</p>

        <section class="panel">
            <h2>Сборка команды</h2>
            <form id="build-form"
                  hx-post="/build"
                  hx-target="#command-result"
                  hx-swap="innerHTML">
                <div class="field">
                    <label for="task-type">Тип задачи</label>
                    <select id="task-type" name="task_type"
                            title="agent — LLM-агент (сам читает, правит, проверяет); run — разовое действие (greet, inventory, ...)">
                        <option value="agent">agent (LLM-агент)</option>
                        <option value="run">run (разовое действие)</option>
                    </select>
                </div>

                <div class="field field-hidden" id="run-action-field">
                    <label for="run-action">Действие (run)</label>
                    <select id="run-action" name="run_action"
                            title="Разовое действие: greet — обзор; inventory — инвентарь; explain — объяснить файл; suggest_improvements — ревью; write_readme, add_docstrings, refactor">
                        <option value="greet">greet — обзор проекта</option>
                        <option value="inventory">inventory — инвентарь</option>
                        <option value="suggest_improvements">suggest_improvements — ревью</option>
                        <option value="explain">explain — объяснить файл</option>
                        <option value="write_readme">write_readme — README</option>
                        <option value="add_docstrings">add_docstrings — докстринги</option>
                        <option value="refactor">refactor — рефакторинг</option>
                    </select>
                </div>

                <div class="field agent-only">
                    <label for="goal">Цель (goal)</label>
                    <textarea id="goal" name="goal" rows="4"
                              title="Задача для LLM простыми словами. Максимум 15 строк. Без обратных кавычек."
                              placeholder="Опишите задачу для агента"></textarea>
                    <label class="goal-file-label" for="goal-file"
                           title="Загрузить цель из файла (.txt, .md) — содержимое подставится в поле goal">Из файла</label>
                    <input type="file" id="goal-file"
                           accept=".txt,.md,text/plain,text/markdown"
                           title="Выберите .txt или .md — текст попадёт в поле goal">
                    <script>
                        (function () {
                            var goalFile = document.getElementById("goal-file");
                            var goalArea = document.getElementById("goal");
                            if (!goalFile || !goalArea) { return; }
                            goalFile.addEventListener("change", function () {
                                var file = goalFile.files && goalFile.files[0];
                                if (!file) { return; }
                                var reader = new FileReader();
                                reader.onload = function (e) {
                                    goalArea.value = e.target.result;
                                };
                                reader.readAsText(file);
                            });
                        })();
                    </script>
                </div>

                <div class="field">
                    <label for="path">Путь (path)</label>
                    <input id="path" name="path" list="path-history"
                           title="Путь к проекту. . — текущая директория; можно указать конкретный файл."
                           placeholder="src/ или ai_coder/agent.py">
                    <datalist id="path-history"></datalist>
                </div>

                <div class="field-row">
                    <div class="field agent-only">
                        <label for="mode">Режим (mode)</label>
                        <select id="mode" name="mode"
                                title="plain — план без выполнения; tool-loop — LLM сам вызывает инструменты (read/edit/finish); decompose — разбить на подзадачи (5+ файлов); plan — показать план, спросить y/n; chain — выполнить issues/*.md; split-goals — разбить фразу на N issues">
                            <option value="plain">plain</option>
                            <option value="tool-loop">tool-loop</option>
                            <option value="decompose">decompose</option>
                            <option value="plan">plan</option>
                            <option value="chain">chain</option>
                            <option value="split-goals">split-goals</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="model">Модель (model)</label>
                        <select id="model" name="model"
                                title="default — модель из config.yaml; flash — дешёвая (deepseek-flash); v4-pro — умная (deepseek-v4-pro)">
                            <option value="default">default</option>
                            <option value="deepseek-flash">flash</option>
                            <option value="deepseek-v4-pro">v4-pro</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="max-cost-rub">Макс. стоимость, ₽</label>
                        <select id="max-cost-rub" name="max_cost_rub"
                                title="Лимит стоимости в рублях. При превышении — остановка.">
                            <option value="">— без ограничения</option>
                            <option value="0.1">0.1 RUB</option>
                            <option value="0.2">0.2 RUB</option>
                            <option value="0.5">0.5 RUB</option>
                            <option value="1">1 RUB</option>
                            <option value="2">2 RUB</option>
                            <option value="5">5 RUB</option>
                            <option value="10">10 RUB</option>
                        </select>
                    </div>
                </div>
                <div class="field agent-only field-hidden" id="chain-path-field">
                    <label for="chain-path">Chain: каталог с issues (chain_path)</label>
                    <input id="chain-path" name="chain_path"
                           list="chain-path-history"
                           title="Каталог с *.md-задачами. ОБЯЗАТЕЛЬНО для mode=chain. Пример: issues/demos/01-chain-sandbox"
                           placeholder="issues/demos/01-chain-sandbox">
                    <datalist id="chain-path-history"></datalist>
                    <small class="field-hint">Каталог с *.md-задачами. Пусто → chain не соберётся.</small>
                </div>


                <div class="field flags agent-only">
                    <span class="flags-label">Флаги</span>
                    <div class="flags-row">
                        <label class="checkbox" id="apply-label" title="Применить правки (для write-действий и tool-loop)">
                            <input type="checkbox" name="apply" value="true"> apply
                        </label>
                        <label class="checkbox" id="commit-label" title="требует apply">
                            <input type="checkbox" name="commit" value="true"> commit
                        </label>
                        <label class="checkbox" id="reverse-check-label" title="требует --tool-loop">
                            <input type="checkbox" name="reverse_check" value="true"> reverse-check
                        </label>
                        <label class="checkbox" id="decompose-reverse-check-label" title="требует --decompose">
                            <input type="checkbox" name="decompose_reverse_check" value="true"> decompose-reverse-check
                        </label>
                    </div>
                    <div class="flags-row">
                        <label for="check-mode">Режим проверки:</label>
                        <select id="check-mode" name="check_mode"
                                title="normal — обычная проверка; dry-run — симуляция (dangerous не выполняются); dry-read — read разрешён, write блокирован">
                            <option value="normal">обычный</option>
                            <option value="dry-run">dry-run (только логи)</option>
                            <option value="dry-read">dry-read (read разрешён, write блокирован)</option>
                        </select>
                    </div>
                </div>

                <details class="advanced">
                    <summary>Дополнительные флаги</summary>
                    <div class="field">
                        <label for="advanced-flags">advanced-flags</label>
                        <textarea id="advanced-flags" name="advanced_flags"
                                  rows="2"
                                  title="Произвольные флаги CLI (например, --only-path, --exclude-web, --with-tests)"
                                  placeholder="--verbose --max-steps 20"></textarea>
                    </div>
                </details>

                <details class="advanced" id="paste-command-block">
                    <summary>Вставить команду</summary>
                    <div class="field">
                        <label for="paste-command">Команда ai-coder</label>
                        <textarea id="paste-command" rows="3"
                                  title="Вставьте готовую команду ai-coder — поля формы заполнятся автоматически"
                                  placeholder="ai-coder agent &quot;...&quot; --tool-loop . "></textarea>
                        <label class="command-file-label" for="command-file"
                               title="Загрузить команду из файла (.txt, .sh, .md)">Из файла</label>
                        <input type="file" id="command-file"
                               accept=".txt,.sh,.md,text/plain"
                               title="Выберите файл с командой — содержимое подставится в поле выше">
                    </div>
                    <div class="actions">
                        <button type="button" id="parse-command-btn"
                                title="Разобрать вставленную команду и заполнить поля формы">Заполнить форму</button>
                    </div>
                </details>

                <div class="actions">
                    <button type="submit" class="primary"
                            title="Собрать команду из полей и показать внизу">Собрать команду</button>
                    <button type="button" id="copy-btn"
                            title="Скопировать собранную команду в буфер обмена">Скопировать</button>
                    <button type="button" id="copy-output-btn"
                            title="Скопировать вывод агента в буфер обмена">Скопировать вывод</button>
                    <button type="button" id="copy-diff-btn"
                            title="git diff HEAD в каталоге проекта — скопировать в буфер">Скопировать git diff</button>
                    <button type="button" id="run-btn"
                            title="Запустить ai-coder со стримингом (SSE)">Запустить</button>
                    <button type="button" id="stop-btn" disabled
                            title="Остановить процесс (SIGTERM)">Остановить</button>
                    <span id="run-status" role="status" aria-live="polite"></span>
                </div>
            </form>

            <div id="command-result"></div>

            <pre id="run-output" class="command-output"></pre>
            <div id="report-link"></div>
        </section>
    </main>

    <script>
        (function () {
            var STORAGE_KEY = "ai-coder:paths";
            var pathInput = document.getElementById("path");
            var dataList = document.getElementById("path-history");

            function loadPaths() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                } catch (e) {
                    return [];
                }
            }

            function renderPaths(paths) {
                dataList.innerHTML = "";
                paths.forEach(function (p) {
                    var opt = document.createElement("option");
                    opt.value = p;
                    dataList.appendChild(opt);
                });
            }

            function rememberPath(value) {
                value = (value || "").trim();
                if (!value) { return; }
                var paths = loadPaths().filter(function (p) { return p !== value; });
                paths.unshift(value);
                paths = paths.slice(0, 20);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(paths));
                } catch (e) { /* ignore */ }
                renderPaths(paths);
            }

            renderPaths(loadPaths());

            // ---- chain_path history (аналог path-history) ----
            var CHAIN_STORAGE_KEY = "ai-coder:chain-paths";
            var chainInput = document.getElementById("chain-path");
            var chainDataList = document.getElementById("chain-path-history");

            function loadChainPaths() {
                try {
                    return JSON.parse(localStorage.getItem(CHAIN_STORAGE_KEY) || "[]");
                } catch (e) {
                    return [];
                }
            }

            function renderChainPaths(paths) {
                if (!chainDataList) { return; }
                chainDataList.innerHTML = "";
                paths.forEach(function (p) {
                    var opt = document.createElement("option");
                    opt.value = p;
                    chainDataList.appendChild(opt);
                });
            }

            function rememberChainPath(value) {
                value = (value || "").trim();
                if (!value) { return; }
                var paths = loadChainPaths().filter(function (p) { return p !== value; });
                paths.unshift(value);
                paths = paths.slice(0, 10);
                try {
                    localStorage.setItem(CHAIN_STORAGE_KEY, JSON.stringify(paths));
                } catch (e) { /* ignore */ }
                renderChainPaths(paths);
            }

            if (chainInput && chainDataList) {
                renderChainPaths(loadChainPaths());
            }

            // A.11: переключатель agent/run.
            function applyTaskType() {
                var tt = document.getElementById("task-type");
                if (!tt) { return; }
                var isRun = tt.value === "run";
                var nodes = document.querySelectorAll(".agent-only");
                for (var k = 0; k < nodes.length; k++) {
                    nodes[k].classList.toggle("field-hidden", isRun);
                }
                var runField = document.getElementById("run-action-field");
                if (runField) { runField.classList.toggle("field-hidden", !isRun); }
            }
            var ttEl = document.getElementById("task-type");
            if (ttEl) { ttEl.addEventListener("change", applyTaskType); }
            applyTaskType();

            // A.13: ограничения по mode/apply/commit/reverse-check.
            function applyModeConstraints() {
                var modeEl = document.getElementById("mode");
                var applyEl = document.querySelector("input[name=apply]");
                var commitEl = document.querySelector("input[name=commit]");
                var reverseEl = document.querySelector("input[name=reverse_check]");
                var ttRun = document.getElementById("task-type");
                var isToolLoop = modeEl ? (modeEl.value === "tool-loop") : false;
                var isApply = applyEl ? applyEl.checked : false;
                var isRun = ttRun ? (ttRun.value === "run") : false;

                if (reverseEl) {
                    // RC доступен только для agent + tool-loop.
                    var rcEnabled = isToolLoop && !isRun;
                    reverseEl.disabled = !rcEnabled;
                    if (!rcEnabled) { reverseEl.checked = false; }
                    var rvLabel = document.getElementById("reverse-check-label");
                    if (rvLabel) { rvLabel.classList.toggle("field-hidden", isRun); }
                }
                // decompose-reverse-check: только для mode=decompose.
                var drcEl = document.querySelector("input[name=decompose_reverse_check]");
                if (drcEl) {
                    var isDecompose = modeEl ? (modeEl.value === "decompose") : false;
                    drcEl.disabled = !isDecompose;
                    if (!isDecompose) { drcEl.checked = false; }
                    var drcLabel = document.getElementById("decompose-reverse-check-label");
                    if (drcLabel) { drcLabel.classList.toggle("field-hidden", !isDecompose); }
                }
                if (commitEl) {
                    commitEl.disabled = !isApply;
                    if (!isApply) { commitEl.checked = false; }
                }
                // chain: поле chain_path видно только при mode=chain.
                var chainField = document.getElementById("chain-path-field");
                if (chainField) {
                    var isChain = modeEl ? (modeEl.value === "chain") : false;
                    chainField.classList.toggle("field-hidden", !isChain);
                }
            }
            var modeCtl = document.getElementById("mode");
            if (modeCtl) { modeCtl.addEventListener("change", applyModeConstraints); }
            var applyCtl = document.querySelector("input[name=apply]");
            if (applyCtl) { applyCtl.addEventListener("change", applyModeConstraints); }
            if (ttEl) { ttEl.addEventListener("change", applyModeConstraints); }
            applyModeConstraints();

            document.addEventListener("htmx:afterRequest", function (evt) {
                if (evt.detail && evt.detail.elt && evt.detail.elt.id === "build-form" && evt.detail.successful) {
                    rememberPath(pathInput.value);
                    if (chainInput && chainInput.value) {
                        rememberChainPath(chainInput.value);
                    }
                }
            });

            document.getElementById("copy-btn").addEventListener("click", function () {
                var pre = document.querySelector("#command-result pre");
                var text = pre ? (pre.textContent || "") : "";
                if (!text) { return; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                } else {
                    var range = document.createRange();
                    range.selectNodeContents(pre);
                    var sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
                var btn = document.getElementById("copy-btn");
                var prev = btn.textContent;
                btn.textContent = "Скопировано";
                setTimeout(function () { btn.textContent = prev; }, 1200);
            });

            document.getElementById("copy-output-btn").addEventListener("click", function () {
                var pre = document.getElementById("run-output");
                var text = pre ? (pre.textContent || "") : "";
                if (!text) { return; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                } else {
                    var range = document.createRange();
                    range.selectNodeContents(pre);
                    var sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                    document.execCommand("copy");
                }
                var btn = document.getElementById("copy-output-btn");
                var prev = btn.textContent;
                btn.textContent = "Скопировано";
                setTimeout(function () { btn.textContent = prev; }, 1200);
            });

            document.getElementById("copy-diff-btn").addEventListener("click", async function () {
                var btn = document.getElementById("copy-diff-btn");
                var prev = btn.textContent;
                var pathInput = document.getElementById("path");
                var fd = new FormData();
                fd.append("path", pathInput ? pathInput.value : "");
                var text = "";
                try {
                    var resp = await fetch("/diff", { method: "POST", body: fd });
                    var data = await resp.json();
                    if (data.error) {
                        text = "[git diff: " + data.error + "]";
                    } else {
                        text = data.diff || "";
                    }
                } catch (e) {
                    text = "[ошибка запроса /diff: " + e.message + "]";
                }
                if (!text) { text = "[пусто — нет изменений или --commit уже закоммитил]"; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    var ta = document.createElement("textarea");
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                }
                btn.textContent = "Скопировано";
                setTimeout(function () { btn.textContent = prev; }, 1200);
            });

            function parseCommand(cmd) {
                var result = {
                    action: "",
                    goal: "",
                    run_action: "",
                    path: ".",
                    mode: "",
                    chain_path: "",
                    check_mode: "",
                    max_cost_rub: "",
                    apply: false,
                    commit: false,
                    advanced_flags: ""
                };
                if (!cmd) { return result; }

                var tokens = [];
                var re = /"([^"]*)"|(\S+)/g;
                var m;
                while ((m = re.exec(cmd)) !== null) {
                    if (m[1] !== undefined) {
                        tokens.push({ value: m[1], quoted: true });
                    } else {
                        tokens.push({ value: m[2], quoted: false });
                    }
                }

                var i = 0;
                if (tokens[i] && tokens[i].value === "ai-coder") { i++; }
                result.action = tokens[i] ? tokens[i].value : "";
                i++;

                var advanced = [];
                var goalSet = false;
                var pathSet = false;

                if (result.action === "agent") {
                    for (; i < tokens.length; i++) {
                        var t = tokens[i];
                        var v = t.value;
                        if (!goalSet && t.quoted) {
                            result.goal = v;
                            goalSet = true;
                            continue;
                        }
                        if (v === "--tool-loop" || v === "--decompose" ||
                            v === "--plan" || v === "--split-goals") {
                            result.mode = v.slice(2);
                            continue;
                        }
                        if (v === "--chain") {
                            result.mode = "chain";
                            // --chain <dir>: забрать следующий токен как путь,
                            // если он не начинается с "-".
                            if (tokens[i + 1] && tokens[i + 1].value.charAt(0) !== "-") {
                                result.chain_path = tokens[i + 1].value;
                                i++;
                            }
                            continue;
                        }
                        if (v === "--dry-run" || v === "--dry-read") {
                            result.check_mode = v.slice(2);
                            continue;
                        }
                        if (v === "--max-cost-rub") {
                            if (tokens[i + 1]) {
                                result.max_cost_rub = tokens[i + 1].value;
                                i++;
                            }
                            continue;
                        }
                        if (v === "--apply") { result.apply = true; continue; }
                        if (v === "--commit") { result.commit = true; continue; }
                        if (!pathSet && v.charAt(0) !== "-") {
                            result.path = v;
                            pathSet = true;
                            continue;
                        }
                        advanced.push(v);
                    }
                } else if (result.action === "run") {
                    var runActionSet = false;
                    for (; i < tokens.length; i++) {
                        var t = tokens[i];
                        var v = t.value;
                        if (v === "--model") {
                            advanced.push(v);
                            if (tokens[i + 1]) { advanced.push(tokens[i + 1].value); i++; }
                            continue;
                        }
                        if (v === "--apply") {
                            result.apply = true;
                            advanced.push(v);
                            continue;
                        }
                        if (v === "--dry-run") {
                            result.check_mode = "dry-run";
                            advanced.push(v);
                            continue;
                        }
                        if (!runActionSet && v.charAt(0) !== "-") {
                            result.run_action = v;
                            runActionSet = true;
                            continue;
                        }
                        if (!pathSet && v.charAt(0) !== "-") {
                            result.path = v;
                            pathSet = true;
                            continue;
                        }
                        advanced.push(v);
                    }
                } else {
                    for (; i < tokens.length; i++) {
                        advanced.push(tokens[i].value);
                    }
                }
                result.advanced_flags = advanced.join(" ");
                return result;
            }

            function applyParsed(parsed) {
                if (!parsed) { return; }
                var goalEl = document.getElementById("goal");
                var pathEl = document.getElementById("path");
                var modeEl = document.getElementById("mode");
                var modelEl = document.getElementById("model");
                var checkModeEl = document.getElementById("check-mode");
                var maxCostEl = document.getElementById("max-cost-rub");
                var advEl = document.getElementById("advanced-flags");
                if (goalEl && parsed.goal) { goalEl.value = parsed.goal; }
                if (pathEl && parsed.path) { pathEl.value = parsed.path; }
                if (modeEl && parsed.mode) {
                    for (var mi = 0; mi < modeEl.options.length; mi++) {
                        if (modeEl.options[mi].value === parsed.mode) {
                            modeEl.value = parsed.mode;
                            break;
                        }
                    }
                }
                if (modelEl && parsed.model) {
                    for (var mmi = 0; mmi < modelEl.options.length; mmi++) {
                        if (modelEl.options[mmi].value === parsed.model) {
                            modelEl.value = parsed.model;
                            break;
                        }
                    }
                }
                if (checkModeEl && parsed.check_mode) { checkModeEl.value = parsed.check_mode; }
                if (maxCostEl && parsed.max_cost_rub) { maxCostEl.value = parsed.max_cost_rub; }
                var chainPathEl = document.getElementById("chain-path");
                if (chainPathEl && parsed.chain_path) {
                    chainPathEl.value = parsed.chain_path;
                    if (typeof rememberChainPath === "function") {
                        rememberChainPath(parsed.chain_path);
                    }
                }
                if (typeof applyModeConstraints === "function") { applyModeConstraints(); }
                var applyEl = document.querySelector("input[name=apply]");
                if (applyEl) { applyEl.checked = !!parsed.apply; }
                var commitEl = document.querySelector("input[name=commit]");
                if (commitEl) { commitEl.checked = !!parsed.commit; }
                if (advEl && parsed.advanced_flags) { advEl.value = parsed.advanced_flags; }

                if (parsed.action === "run") {
                    var ttPending = document.getElementById("task-type");
                    if (ttPending) { ttPending.value = "run"; }
                    var raPending = document.getElementById("run-action");
                    if (raPending && parsed.run_action) { raPending.value = parsed.run_action; }
                    if (typeof applyTaskType === "function") { applyTaskType(); }
                }
            }

            var pending = sessionStorage.getItem("pending_command");
            if (pending) {
                sessionStorage.removeItem("pending_command");
                applyParsed(parseCommand(pending));

                var notice = document.createElement("div");
                notice.id = "pending-notice";
                notice.textContent = "Команда из справки подставлена в форму.";
                var form = document.getElementById("build-form");
                if (form && form.parentNode) {
                    form.parentNode.insertBefore(notice, form);
                }
            }

            var parseCommandBtn = document.getElementById("parse-command-btn");
            if (parseCommandBtn) {
                parseCommandBtn.addEventListener("click", function () {
                    var pasteEl = document.getElementById("paste-command");
                    if (!pasteEl) { return; }
                    applyParsed(parseCommand(pasteEl.value));
                });
            }

            var commandFile = document.getElementById("command-file");
            if (commandFile) {
                commandFile.addEventListener("change", function () {
                    var file = commandFile.files && commandFile.files[0];
                    if (!file) { return; }
                    var reader = new FileReader();
                    reader.onload = function (e) {
                        var pasteEl = document.getElementById("paste-command");
                        if (!pasteEl) { return; }
                        pasteEl.value = e.target.result;
                        applyParsed(parseCommand(pasteEl.value));
                    };
                    reader.readAsText(file);
                });
            }

            var runBtn = document.getElementById("run-btn");
            var stopBtn = document.getElementById("stop-btn");
            var runOutput = document.getElementById("run-output");
            var currentAbort = null;
            var currentRunId = null;

            var runStatus = document.getElementById("run-status");
            var runStartedAt = null;
            var runTimer = null;

            function _elapsedSec() {
                return Math.round((Date.now() - runStartedAt) / 1000);
            }

            function setRunning(running) {
                runBtn.disabled = running;
                stopBtn.disabled = !running;
                if (running) {
                    runStartedAt = Date.now();
                    runBtn.classList.add("btn-running");
                    runStatus.textContent = "Выполняется… 0 с";
                    if (runTimer) { clearInterval(runTimer); }
                    runTimer = setInterval(function () {
                        runStatus.textContent = "Выполняется… " + _elapsedSec() + " с";
                    }, 1000);
                } else {
                    if (runTimer) { clearInterval(runTimer); runTimer = null; }
                    runBtn.classList.remove("btn-running");
                    if (runStartedAt) {
                        runStatus.textContent = "Готово за " + _elapsedSec() + " с";
                        runStartedAt = null;
                    }
                }
            }

            runBtn.addEventListener("click", async function () {
                if (currentAbort) { currentAbort.abort(); }
                runOutput.textContent = "";
                document.getElementById("report-link").innerHTML = "";
                currentRunId = null;
                setRunning(true);

                var form = document.getElementById("build-form");
                var fd = new FormData(form);

                currentAbort = new AbortController();

                try {
                    var resp = await fetch("/run", {
                        method: "POST",
                        body: fd,
                        signal: currentAbort.signal,
                    });
                    if (!resp.ok) {
                        runOutput.textContent = "HTTP " + resp.status + ": " + (await resp.text());
                        setRunning(false);
                        return;
                    }
                    var reader = resp.body.getReader();
                    var decoder = new TextDecoder();
                    var buffer = "";

                    while (true) {
                        var chunk = await reader.read();
                        if (chunk.done) { break; }
                        buffer += decoder.decode(chunk.value, { stream: true });
                        var events = buffer.split("\n\n");
                        buffer = events.pop();
                        for (var evt of events) {
                            var lines = evt.split("\n");
                            for (var line of lines) {
                                if (line.startsWith("data: ")) {
                                    var text = line.slice(6);
                                    var match = text.match(/^run_id:\s*(.+)$/);
                                    if (match) {
                                        currentRunId = match[1].trim();
                                        continue;
                                    }
                                    var omatch = text.match(/^\[отчёт\]\s*(\S+)$/);
                                    if (omatch) {
                                        document.getElementById("report-link").innerHTML =
                                            '<a href="' + omatch[1] + '" target="_blank">Открыть отчёт</a>';
                                        continue;
                                    }
                                    var jmatch = text.match(/^Журнал:\s*(.+)$/);
                                    if (jmatch) {
                                        var jpath = jmatch[1].trim();
                                        if (jpath.startsWith(".ai-out/")) {
                                            jpath = jpath.slice(".ai-out/".length);
                                        }
                                        // jpath = "<project>/<journal>"
                                        var reportUrl = "/reports/" + jpath;
                                        document.getElementById("report-link").innerHTML =
                                            '<a href="' + reportUrl + '" target="_blank">Открыть отчёт</a>';
                                    }
                                    runOutput.textContent += text + "\n";
                                    runOutput.scrollTop = runOutput.scrollHeight;
                                }
                            }
                        }
                    }
                } catch (e) {
                    if (e.name !== "AbortError") {
                        runOutput.textContent += "\n[ошибка: " + e.message + "]\n";
                    }
                } finally {
                    currentAbort = null;
                    setRunning(false);
                }
            });

            stopBtn.addEventListener("click", function () {
                if (currentRunId) {
                    fetch("/stop/" + currentRunId, { method: "POST" }).catch(function () {});
                }
                if (currentAbort) { currentAbort.abort(); }
                setRunning(false);
            });

        })();
    </script>
</body>
</html>
