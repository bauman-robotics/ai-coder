<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ai-coder GUI</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <header>
        <h1>ai-coder GUI</h1>
        <nav class="report-nav">
            <a href="/reports">Все отчёты</a>
            <a href="/stats">Статистика</a>
        </nav>
    </header>
    <main>
        <p>Веб-панель ai-coder. Соберите команду для запуска агента.</p>

        <section class="panel">
            <h2>Сборка команды</h2>
            <form id="build-form"
                  hx-post="/build"
                  hx-target="#command-result"
                  hx-swap="innerHTML">
                <div class="field">
                    <label for="goal">Цель (goal)</label>
                    <textarea id="goal" name="goal" rows="4"
                              placeholder="Опишите задачу для агента"></textarea>
                </div>

                <div class="field">
                    <label for="path">Путь (path)</label>
                    <input id="path" name="path" list="path-history"
                           placeholder="src/ или ai_coder/agent.py">
                    <datalist id="path-history"></datalist>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="mode">Режим (mode)</label>
                        <select id="mode" name="mode">
                            <option value="plain">plain</option>
                            <option value="tool-loop">tool-loop</option>
                            <option value="decompose">decompose</option>
                            <option value="plan">plan</option>
                            <option value="chain">chain</option>
                            <option value="split-goals">split-goals</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="model">Модель (model)</label>
                        <select id="model" name="model">
                            <option value="default">default</option>
                            <option value="deepseek-flash">flash</option>
                            <option value="deepseek-v4-pro">v4-pro</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="max-cost-rub">Макс. стоимость, ₽</label>
                        <select id="max-cost-rub" name="max_cost_rub">
                            <option value="">— без ограничения</option>
                            <option value="0.1">0.1 RUB</option>
                            <option value="0.2">0.2 RUB</option>
                            <option value="0.5">0.5 RUB</option>
                            <option value="1">1 RUB</option>
                            <option value="2">2 RUB</option>
                            <option value="5">5 RUB</option>
                            <option value="10">10 RUB</option>
                        </select>
                    </div>
                </div>

                <div class="field flags">
                    <span class="flags-label">Флаги</span>
                    <label class="checkbox">
                        <input type="checkbox" name="apply" value="true"> apply
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" name="commit" value="true"> commit
                    </label>
                    <label for="check-mode">режим проверки</label>
                    <select id="check-mode" name="check_mode">
                        <option value="normal">обычный</option>
                        <option value="dry-run">dry-run (только логи)</option>
                        <option value="dry-read">dry-read (read разрешён, write блокирован)</option>
                    </select>
                </div>

                <details class="advanced">
                    <summary>Дополнительные флаги</summary>
                    <div class="field">
                        <label for="advanced-flags">advanced-flags</label>
                        <textarea id="advanced-flags" name="advanced_flags"
                                  rows="2"
                                  placeholder="--verbose --max-steps 20"></textarea>
                    </div>
                </details>

                <div class="actions">
                    <button type="submit" class="primary">Собрать команду</button>
                    <button type="button" id="copy-btn">Скопировать</button>
                    <button type="button" id="copy-output-btn">Скопировать вывод</button>
                    <button type="button" id="run-btn">Запустить</button>
                    <button type="button" id="stop-btn" disabled>Остановить</button>
                </div>
            </form>

            <div id="command-result"></div>

            <pre id="run-output" class="command-output"></pre>
            <div id="report-link"></div>
        </section>
    </main>

    <script>
        (function () {
            var STORAGE_KEY = "ai-coder:paths";
            var pathInput = document.getElementById("path");
            var dataList = document.getElementById("path-history");

            function loadPaths() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                } catch (e) {
                    return [];
                }
            }

            function renderPaths(paths) {
                dataList.innerHTML = "";
                paths.forEach(function (p) {
                    var opt = document.createElement("option");
                    opt.value = p;
                    dataList.appendChild(opt);
                });
            }

            function rememberPath(value) {
                value = (value || "").trim();
                if (!value) { return; }
                var paths = loadPaths().filter(function (p) { return p !== value; });
                paths.unshift(value);
                paths = paths.slice(0, 20);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(paths));
                } catch (e) { /* ignore */ }
                renderPaths(paths);
            }

            renderPaths(loadPaths());

            document.addEventListener("htmx:afterRequest", function (evt) {
                if (evt.detail && evt.detail.elt && evt.detail.elt.id === "build-form" && evt.detail.successful) {
                    rememberPath(pathInput.value);
                }
            });

            document.getElementById("copy-btn").addEventListener("click", function () {
                var pre = document.querySelector("#command-result pre");
                var text = pre ? (pre.textContent || "") : "";
                if (!text) { return; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                } else {
                    var range = document.createRange();
                    range.selectNodeContents(pre);
                    var sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
                var btn = document.getElementById("copy-btn");
                var prev = btn.textContent;
                btn.textContent = "Скопировано";
                setTimeout(function () { btn.textContent = prev; }, 1200);
            });

            document.getElementById("copy-output-btn").addEventListener("click", function () {
                var pre = document.getElementById("run-output");
                var text = pre ? (pre.textContent || "") : "";
                if (!text) { return; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                } else {
                    var range = document.createRange();
                    range.selectNodeContents(pre);
                    var sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                    document.execCommand("copy");
                }
                var btn = document.getElementById("copy-output-btn");
                var prev = btn.textContent;
                btn.textContent = "Скопировано";
                setTimeout(function () { btn.textContent = prev; }, 1200);
            });

            var runBtn = document.getElementById("run-btn");
            var stopBtn = document.getElementById("stop-btn");
            var runOutput = document.getElementById("run-output");
            var currentAbort = null;
            var currentRunId = null;

            function setRunning(running) {
                runBtn.disabled = running;
                stopBtn.disabled = !running;
            }

            runBtn.addEventListener("click", async function () {
                if (currentAbort) { currentAbort.abort(); }
                runOutput.textContent = "";
                document.getElementById("report-link").innerHTML = "";
                currentRunId = null;
                setRunning(true);

                var form = document.getElementById("build-form");
                var fd = new FormData(form);

                currentAbort = new AbortController();

                try {
                    var resp = await fetch("/run", {
                        method: "POST",
                        body: fd,
                        signal: currentAbort.signal,
                    });
                    if (!resp.ok) {
                        runOutput.textContent = "HTTP " + resp.status + ": " + (await resp.text());
                        setRunning(false);
                        return;
                    }
                    var reader = resp.body.getReader();
                    var decoder = new TextDecoder();
                    var buffer = "";

                    while (true) {
                        var chunk = await reader.read();
                        if (chunk.done) { break; }
                        buffer += decoder.decode(chunk.value, { stream: true });
                        var events = buffer.split("\n\n");
                        buffer = events.pop();
                        for (var evt of events) {
                            var lines = evt.split("\n");
                            for (var line of lines) {
                                if (line.startsWith("data: ")) {
                                    var text = line.slice(6);
                                    var match = text.match(/^run_id:\s*(.+)$/);
                                    if (match) {
                                        currentRunId = match[1].trim();
                                        continue;
                                    }
                                    var jmatch = text.match(/^Журнал:\s*(.+)$/);
                                    if (jmatch) {
                                        var jpath = jmatch[1].trim();
                                        if (jpath.startsWith(".ai-out/")) {
                                            jpath = jpath.slice(".ai-out/".length);
                                        }
                                        // jpath = "<project>/<journal>"
                                        var reportUrl = "/reports/" + jpath;
                                        document.getElementById("report-link").innerHTML =
                                            '<a href="' + reportUrl + '" target="_blank">Открыть отчёт</a>';
                                    }
                                    runOutput.textContent += text + "\n";
                                    runOutput.scrollTop = runOutput.scrollHeight;
                                }
                            }
                        }
                    }
                } catch (e) {
                    if (e.name !== "AbortError") {
                        runOutput.textContent += "\n[ошибка: " + e.message + "]\n";
                    }
                } finally {
                    currentAbort = null;
                    setRunning(false);
                }
            });

            stopBtn.addEventListener("click", function () {
                if (currentRunId) {
                    fetch("/stop/" + currentRunId, { method: "POST" }).catch(function () {});
                }
                if (currentAbort) { currentAbort.abort(); }
                setRunning(false);
            });

        })();
    </script>
</body>
</html>
